<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Instituto Através da Esperança</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Instituto Através da Esperança</h1>

        <!-- Imagem posicionada entre o título h1 e o nav -->
        <img src="Inst-at-da-esp-AIGEN.png" alt="Banner do Instituto Através da Esperança" width="500">
        
        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro de Voluntário / Apoiador</h2>
            <p>Preencha o formulário abaixo para fazer parte da nossa rede de apoio.</p>

            <form action="#" method="post">
                <p>
                    <label for="nome">Nome completo:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>
                </p>

                <p>
                    <label for="telefone">Telefone:</label><br>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                </p>

                <p>
                    <label for="mensagem">Como gostaria de ajudar?</label><br>
                    <textarea id="mensagem" name="mensagem" rows="4" cols="40" placeholder="Conte-nos um pouco sobre como quer colaborar..."></textarea>
                </p>

                <button type="submit">Enviar Cadastro</button>
            </form>
        </section>
    </main>

</body>
</html>
